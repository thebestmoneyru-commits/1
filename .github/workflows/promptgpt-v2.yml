name: PROMPTGPT v2 regression checks

on:
  push:
    paths:
      - "promptgpt-v2/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/promptgpt-v2.yml"
  pull_request:
    paths:
      - "promptgpt-v2/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/promptgpt-v2.yml"

jobs:
  typecheck-and-self-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: Run offline PROMPTGPT v2 regression suite
        run: npx tsx promptgpt-v2/runSelfTests.cli.ts

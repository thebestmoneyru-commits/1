name: PROMPTGPT v2 regression checks

on:
  push:
    paths:
      - "promptgpt-v2/**"
      - "shared/**"
      - "server.ts"
      - "src/**"
      - ".env.example"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/promptgpt-v2.yml"
  pull_request:
    paths:
      - "promptgpt-v2/**"
      - "server.ts"
      - "src/**"
      - ".env.example"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/promptgpt-v2.yml"

jobs:
  typecheck-and-self-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock --legacy-peer-deps
      - name: TypeScript type check
        run: npx tsc --noEmit --project promptgpt-v2/tsconfig.json
      - name: Run offline PROMPTGPT v2 regression suite
        run: npx tsx promptgpt-v2/runSelfTests.cli.ts
      - name: Build the integrated application
        run: npx vite build
      - name: Type-check integrated server and frontend sources
        run: npx tsc --noEmit
